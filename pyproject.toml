[project]
name = "ha-youtrack"
version = "0.0.1"
description = "Home Assistant integration for JetBrains YouTrack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.2"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "A",   # builtins shadowing
    "ARG", # unused arguments
    "ASYNC",
    "B",   # bugbear
    "C4",  # comprehensions
    "DTZ", # naive datetimes
    "E",
    "F",
    "I",   # isort
    "PIE",
    "PT",  # pytest style
    "PTH", # pathlib
    "RET",
    "RUF",
    "SIM",
    "T20", # no print
    "TC",  # type-checking imports
    "UP",  # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components", "tests"]
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components.youtrack --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["custom_components/youtrack"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
