rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Five minutes by default, configurable; the knowledge base is polled six times slower.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: The integration uses the Home Assistant HTTP client and has no requirements.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities are coordinator entities and register no listeners of their own.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: YouTrack is a service reached through a user-supplied address; nothing is discovered.
  discovery:
    status: exempt
    comment: YouTrack is a service reached through a user-supplied address; nothing is discovered.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration connects to a service, not to devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: exempt
    comment: Every entity is a primary entity; none is a configuration or diagnostic entity.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity answers a question users asked for and costs no extra requests.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done
